# 06 — Relaxed scans over internal coordinates, and what to do with the result.
#
#   umadriver --manifest examples/06_bond_scan.yaml
#
# Walk a distance, an angle or a dihedral from one value to another. At each point
# the scanned coordinates are held fixed and everything else is minimized, so the
# profile is a real slice through the PES rather than a rigid distortion. Each
# point starts from the previous relaxed geometry, which keeps the path continuous
# — see `scan_shards` at the bottom for how a large grid is split up without
# losing that.
#
# ATOMS ARE NUMBERED FROM 1 — the first atom in the XYZ is atom 1, matching xtb,
# Gaussian and your structure viewer. tests/data/h2o.xyz is:
#
#   1  O
#   2  H
#   3  H
#
# so `distance: [1, 2]` is an O-H bond and `angle: [2, 1, 3]` is H-O-H (the middle
# atom is the vertex).
#
# The usual reason to run one is to get a transition-state guess when --optts from
# a hand-built structure will not converge:
#
#   1. scan the coordinate being made or broken, straddling where the barrier is
#   2. take scan/<tag>_scan_max.xyz — the highest point on the profile
#   3. umadriver that file with --optts --freq, and check n_imag == 1
#
# The scan itself never gives you a transition state: every point is constrained,
# so none of them is a stationary point.
common:
  model: uma-m-1p1
  device: cuda

jobs:
  # --- one distance ---------------------------------------------------------
  - xyz: tests/data/h2o.xyz
    out_dir: runs/scan_OH
    overrides:
      scan: {distance: [1, 2], from: 0.85, to: 1.60, steps: 16}
      opt_mode: Normal      # applies to the constrained minimization at each point
      maxcycles: 200
      # optimizer defaults to Sella when a scan is requested; --opt LBFGS also works.

  # --- one angle (degrees; the middle atom is the vertex) -------------------
  - xyz: tests/data/h2o.xyz
    out_dir: runs/scan_HOH
    overrides:
      scan: {angle: [2, 1, 3], from: 85.0, to: 125.0, steps: 9}

  # --- two coordinates, one after the other ---------------------------------
  # `sequential` (the default) finishes the first coordinate, then walks the
  # second from where the first left off, holding the first at its end value.
  # Costs the sum of the step counts, minus the shared handover geometry.
  - xyz: tests/data/h2o.xyz
    out_dir: runs/scan_sequential
    overrides:
      scan:
        mode: sequential
        coords:
          - {distance: [1, 2], from: 0.95, to: 1.30, steps: 6}
          - {angle: [2, 1, 3], from: 104.0, to: 130.0, steps: 6}
      # 6 + 6 - 1 = 11 optimizations

  # --- two coordinates moving together --------------------------------------
  # `concerted` advances every coordinate in lockstep, tracing ONE path through
  # them — the natural choice when a bond breaks as an angle opens. All
  # coordinates must share a step count. Costs that many optimizations.
  - xyz: tests/data/h2o.xyz
    out_dir: runs/scan_concerted
    overrides:
      scan:
        mode: concerted
        coords:
          - {distance: [1, 2], from: 0.95, to: 1.30, steps: 8}
          - {angle: [2, 1, 3], from: 104.0, to: 130.0, steps: 8}
      # 8 optimizations along one path — contrast with the grid below

  # --- a full 2D surface ----------------------------------------------------
  # `grid` computes every combination: n1 * n2 optimizations. Limited to exactly
  # two coordinates, since a third turns a manageable 12x12 into 1728 points.
  #
  # Run whole, points are walked in boustrophedon order (each row traversed
  # opposite to the last), so consecutive points are always neighbours and every
  # one starts from a good guess. Pivot the CSV on the two `_target` columns for
  # the surface as a matrix.
  - xyz: tests/data/h2o.xyz
    out_dir: runs/scan_grid
    overrides:
      scan:
        mode: grid
        coords:
          - {distance: [1, 2], from: 0.90, to: 1.30, steps: 5}
          - {distance: [1, 3], from: 0.90, to: 1.30, steps: 5}
      # 5 x 5 = 25 optimizations, too few to be worth splitting up

  # --- a big surface, spread over the GPUs ----------------------------------
  # A grid of any size is one job on one GPU, and 196 constrained optimizations
  # in series is a long afternoon. `scan_shards` cuts it into pieces that run as
  # separate jobs on the shared queue, alongside everything else in the manifest.
  #
  # A short serial pass ("the spine") walks the first point of every shard first,
  # so each shard still starts from a relaxed geometry rather than jumping cold
  # to its corner of the surface — costing about 7% extra optimizations to keep
  # the surface continuous. Then:
  #
  #   scan/.shards.json   the partition, reused on resume
  #   spine/              the seeding pass
  #   shard00/ .. NN/     each holding its own slice, in the usual layout
  #   scan/*.csv|xyz      the merged result, exactly where an unsharded run
  #                       puts it — so the workflow above is unchanged
  #
  # `auto` (the default) gives a grid one shard per row, so the partition depends
  # on the scan and not on how many GPUs happen to be free. That is what lets a
  # resumed run reuse it safely. `off` keeps the scan whole.
  - xyz: tests/data/h2o.xyz
    out_dir: runs/scan_big_grid
    scan_shards: auto      # or `off`, or a number
    overrides:
      scan:
        mode: grid
        coords:
          - {distance: [1, 2], from: 0.90, to: 1.60, steps: 14}
          - {distance: [1, 3], from: 0.90, to: 1.60, steps: 14}
      # 14 x 14 = 196 optimizations -> 14 shards of 14
      #
      # Only the *outer* (first) coordinate is cut, so a 3 x 60 grid gets 3 shards
      # while 60 x 3 gets 20. Put the coordinate you have more points of second.

  # --- the CLI's positional form --------------------------------------------
  # The number of values picks the coordinate type: 5 = distance, 6 = angle,
  # 7 = dihedral. This is what `--scan 1 3 0.85 1.6 16` produces.
  - xyz: tests/data/h2o.xyz
    out_dir: runs/scan_flat
    scan: [1, 3, 0.85, 1.60, 16]

#
# What you get in each out_dir:
#
#   scan/conf_0000_scan.csv       point, <coord>_target, <coord>_actual, energy_Eh,
#                                 rel_kcal, converged, steps  <- the actual product
#   scan/conf_0000_scan.xyz       every point as a frame, for animating the path
#   scan/conf_0000_scan_max.xyz   the highest point alone — the TS guess
#
# Coordinate columns are named d_1_2 / a_2_1_3 / t_8_5_1_4 (1-based atom numbers).
# `_actual` is the value the point really ended at, not the one requested: the
# constraint is satisfied to a tolerance, and a warning fires if any point drifts
# more than 1e-3 A or 0.1 deg off target.
#
# energies.csv gets a row per conformer as always, with route=SCAN, but it is only
# a summary: the energy is the last scan point and `converged` means every point
# converged. The profile is the result — read the CSV above.
#
# --freq on a scan warns and --irc is skipped: a constrained endpoint is not a
# stationary point, so frequencies there carry spurious imaginary modes. A job
# asking for frequencies is also never sharded, since each shard would compute
# them on its own last constrained point.
#
# If a shard fails, the merge writes scan/*_scan.partial.csv and nothing else — a
# profile with a hole in it is not a shorter profile, and *_scan_max.xyz is what
# you would have fed to --optts. Rerun and --resume picks up only what is missing.
